services:
  zora-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zora-bot-service
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_MODE: sqlite
      SQLITE_DB_PATH: /data/bot.db
    volumes:
      - zora_bot_data:/data
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: zora-bot-caddy
    restart: unless-stopped
    depends_on:
      zora-bot:
        condition: service_started
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  zora_bot_data:
  caddy_data:
  caddy_config:
